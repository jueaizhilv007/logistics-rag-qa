[project]
name = "rag-qa"
version = "0.1.0"
description = "可嵌入的 RAG 问答内核，检索与生成分层，无编排框架依赖"
requires-python = ">=3.11"
dependencies = [
    # OpenAI 兼容协议，Embedding 与 LLM 共用一套客户端，换服务商只改 base_url
    "openai>=1.40",
    # 向量存储
    "lancedb>=0.9",
    "pyarrow>=15",
    # 按列扫描。LanceDB 的 Table 只有 to_arrow()，它不接收 columns 参数、
    # 会把向量一起读进内存；建 BM25 索引要只扫文本列，只能走 to_lance().scanner()
    "pylance>=13.0.0",
    # 文档解析
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "charset-normalizer>=3.3",
    # 稀疏检索，中文分词加 BM25 排序
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    # token 预算计算
    "tiktoken>=0.7",
    # 配置
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 命令行
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# 接入层依赖，Skill 内核本身不需要，仅在对外提供 HTTP 服务时安装
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[project.scripts]
rag-qa = "rag_core.cli:app"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
