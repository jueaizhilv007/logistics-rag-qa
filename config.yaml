app:
  name: rag-qa
  data_dir: ./data

# 向量化服务。endpoints 下可挂任意数量的服务商，
# 切换 provider 只改上面那一行，不用增删字段。
embedding:
  provider: agicto
  endpoints:
    agicto:
      base_url: https://api.agicto.cn/v1/
      model: text-embedding-3-small
      batch_size: 64
    local:
      base_url: http://localhost:11434/v1
      model: nomic-embed-text
      batch_size: 32

# LLM 服务。temperature 固定为 0：
# 政策问答要求同一问题得到同一答案，否则引用编号不稳定，追溯链路会失效。
llm:
  provider: agicto
  endpoints:
    agicto:
      base_url: https://api.agicto.cn/v1/
      model: deepseek-chat
      temperature: 0.0
      max_tokens: 1024
    local:
      base_url: http://localhost:11434/v1
      model: qwen2.5:7b
      temperature: 0.0
      max_tokens: 1024

# 向量存储
vector_store:
  provider: lancedb
  path: ./data/index
  collection: docs
  # 距离度量。embedding 场景必须用 cosine，
  # 不指定时 LanceDB 默认走 L2，语义排序口径会不一致。
  metric: cosine

# 切片策略
# strategy: fixed 固定窗口，hierarchical 按标题层级
# inject_heading: 是否把标题链前缀拼进检索文本
chunking:
  strategy: hierarchical
  size: 500
  overlap: 50
  inject_heading: true

# 检索策略
# mode 默认必须是 vector：E1 baseline 的口径就是「固定切片加纯向量」。
# 若此处默认开启 hybrid，baseline 不再是纯向量，E2 以后的归因全部失效。
retrieval:
  mode: vector
  top_k: 4
  hybrid:
    bm25_k: 10
    vector_k: 10
    rrf_k: 60
  rerank:
    enabled: true
    # 原定 provider 是 bge_local（本地 cross-encoder），改用服务端 /rerank：
    # 本地方案要引入 torch 与 GB 级模型，代价与一组对照实验不相称；
    # LLM 打分那条退路又不是 cross-encoder，与 5.3 节的论证不符。
    # 选型变更的完整理由见 src/rag_core/retrieval/rerankers.py 与笔记 04。
    provider: agicto
    # 候选池大小。重排的意义在于「从更大候选里挑更好的」，
    # 若它等于最终条数，重排就无事可做
    top_n: 20
    options:
      model: gte-rerank-v2
      base_url: https://api.agicto.cn/v1/
      # 单次请求上限。服务端实测 10 个正常返回、11 个起一律返回 10 个
      # 且不报错；超出的候选必须分批请求，否则会被静默挤出竞争
      batch_size: 10

# 生成层
generate:
  # 送进 LLM 的上下文 token 预算，超出后丢弃低排名片段
  max_context_tokens: 6000
  # 检索为空时的拒答话术
  empty_answer: 知识库未覆盖该问题，建议转人工

logging:
  level: INFO
  dir: ./logs
